<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>算命格系统（分享版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  color-scheme: light;
  --bg:#e9e7de; --surface:#f7f4ec; --surface2:#efeade;
  --text:#1d2129; --dim:#5f6459; --border:#d5cfbc;
  --accent:#8a6d2f; --accent2:#b03a2e; --gold:#8a6d2f;
  --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#101319; --surface:#181d27; --surface2:#202634;
    --text:#e8e4da; --dim:#9aa1b0; --border:#2a3040;
    --accent:#c9a86a; --accent2:#d0573f; --gold:#c9a86a;
    --on-accent:#101319;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.55}
.serif{font-family:"Noto Serif SC","Songti SC","STSong",serif}
main{max-width:680px;margin:0 auto;padding:0 16px 44px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:4px;margin-top:16px}
.tabs button{flex:1;border:0;background:transparent;color:var(--dim);font-size:14px;font-weight:700;padding:10px 8px;border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--on-accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:16px}
.intro{font-size:14px;color:var(--dim);line-height:1.7;margin:16px 2px 0}
label.lab,.lab{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
input,select{width:100%;margin-top:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;padding:10px 12px;font-size:16px;outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--accent)}
select:disabled{opacity:.45}
.seg{display:flex;gap:4px;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:4px;margin-top:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--dim);font-size:14px;font-weight:700;padding:8px 6px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mt{margin-top:12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.err{margin-top:12px;font-size:14px;font-weight:700;color:var(--accent2)}
.btn-main{width:100%;margin-top:16px;border:0;background:var(--accent2);color:#fff;font-size:16px;font-weight:700;padding:13px;border-radius:12px;cursor:pointer}
.btn-main:active{opacity:.8}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .45s ease both}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pillar{border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center}
.pillar.day{border-color:var(--accent2);background:var(--surface2)}
.pillar .pl{font-size:12px;color:var(--dim)}
.pillar .ss{font-size:12px;margin-top:2px;color:var(--dim)}
.pillar.day .ss{color:var(--accent2);font-weight:700}
.pillar .big{font-size:36px;font-weight:900;line-height:1.15;color:var(--text)}
.pillar .big.stem{color:var(--gold)}
.pillar .hid{border-top:1px solid var(--border);margin-top:6px;padding-top:6px;display:flex;flex-direction:column;gap:2px}
.pillar .hid p{margin:0;font-size:11px;line-height:1.3;color:var(--dim)}
.pillar .hid b{color:var(--text)}
.pillar .ny{font-size:11px;color:var(--dim);margin-top:6px}
.pillar.dash{border-style:dashed;display:flex;flex-direction:column;justify-content:center}
.meta{font-size:12px;color:var(--dim);line-height:1.7;margin-top:12px}
.meta b{color:var(--accent2)}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.bar-row .en{width:24px;font-size:14px;font-weight:700}
.bar-track{flex:1;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar-fill{height:100%;border-radius:99px}
.bar-row .val{width:32px;text-align:right;font-size:12px;color:var(--dim)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff}
.pill.outline{background:transparent;border:1px solid}
.chip{display:inline-block;border-radius:99px;background:var(--surface2);padding:4px 10px;font-size:12px;font-weight:700}
h3.sec{font-size:18px;margin:0 0 4px}
p.para{font-size:14px;line-height:1.75;margin:8px 0 0}
.dy{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:8px}
.dy.cur{border-color:var(--accent2);background:var(--surface2)}
.dy .top{display:flex;align-items:center;gap:12px}
.dy .age{width:86px;flex-shrink:0}
.dy .age p{margin:0;font-size:14px;font-weight:700}
.dy .age span{font-size:12px;color:var(--dim)}
.dy .gz{font-size:28px;font-weight:900;color:var(--gold)}
.dy .ss2{font-size:12px;color:var(--dim);line-height:1.5}
.cur-badge{margin-left:auto;border-radius:99px;background:var(--accent2);color:#fff;padding:2px 10px;font-size:12px;font-weight:700}
.ln-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ln{border:1px solid var(--border);border-radius:12px;padding:8px 12px;text-align:center}
.ln.cur{border-color:var(--accent2);background:var(--surface2)}
.ln p{margin:0}
.ln .y{font-size:12px;color:var(--dim)}
.ln .g{font-size:20px;font-weight:900}
.ln .s{font-size:12px;color:var(--dim)}
.small{font-size:12px;color:var(--dim);line-height:1.7}
.hidden{display:none}
.pdf-bar{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn-pdf{border:0;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer}
.btn-pdf:active{opacity:.8}
.btn-pdf:disabled{opacity:.55;cursor:default}
#pdfRoot{position:fixed;inset:0;overflow-y:auto;background:#e9e7de;z-index:60;padding:16px 10px 34px}
#pdfRoot.hidden{display:none}
.pdf-top{max-width:760px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;color:#1d2129}
.pdf-top button{border:1px solid #d5cfbc;background:#fff;color:#1d2129;border-radius:10px;padding:6px 16px;font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="tabs" role="tablist" aria-label="功能切换">
    <button id="tabCast" class="on" role="tab" aria-selected="true">排命盘</button>
    <button id="tabLearn" role="tab" aria-selected="false">学理</button>
  </div>

  <div id="viewCast">
    <p class="intro">子平八字：报上出生年月日时，排出四柱命盘，看日主旺衰、格局喜忌、神煞与一生大运流年。时间按北京时间，节气按精确交节时刻排。</p>

    <section class="card" aria-label="报生辰" style="margin-top:12px">
      <div class="grid2">
        <div>
          <label class="lab" for="nm">称呼（可空）</label>
          <input id="nm" placeholder="如：我、妈妈、宝宝" autocomplete="off" />
        </div>
        <div>
          <span class="lab" id="gender-label">性别（定大运顺逆）</span>
          <div class="seg" role="group" aria-labelledby="gender-label">
            <button id="gF" type="button">女命</button>
            <button id="gM" type="button">男命</button>
          </div>
        </div>
      </div>

      <div class="mt">
        <span class="lab" id="cal-label">生日历法</span>
        <div class="seg" role="group" aria-labelledby="cal-label">
          <button id="cG" type="button" class="on">公历（阳历）</button>
          <button id="cN" type="button">农历（阴历）</button>
        </div>
      </div>

      <div id="solarBox" class="mt">
        <label class="lab" for="bd">出生日期</label>
        <input id="bd" type="date" min="1900-01-01" max="2100-12-31" />
      </div>

      <div id="lunarBox" class="mt hidden">
        <div class="grid3">
          <div>
            <label class="lab" for="ly">农历年</label>
            <input id="ly" inputmode="numeric" placeholder="如 1990" />
          </div>
          <div>
            <label class="lab" for="lm">月</label>
            <select id="lm"></select>
          </div>
          <div>
            <label class="lab" for="ld">日</label>
            <select id="ld"></select>
          </div>
        </div>
        <label class="check mt"><input type="checkbox" id="lleap" />这一年这个月是闰月（如闰六月就选六月再勾此项）</label>
      </div>

      <div class="grid2 mt" style="align-items:end">
        <div>
          <span class="lab" id="bt-label">出生时间（点选时、分）</span>
          <div class="grid2" style="gap:8px" role="group" aria-labelledby="bt-label">
            <select id="bh" aria-label="出生时间：时"></select>
            <select id="bm" aria-label="出生时间：分"></select>
          </div>
        </div>
        <label class="check" style="padding-bottom:12px"><input type="checkbox" id="hu" />时辰不详（只排三柱）</label>
      </div>

      <p id="err" class="err hidden" role="alert"></p>
      <button id="castBtn" class="btn-main" type="button">排命盘</button>
    </section>

    <div id="result"></div>
  </div>

  <div id="viewLearn" class="hidden"></div>
</main>

<div id="pdfRoot" class="hidden" role="dialog" aria-label="PDF 生成">
  <div class="pdf-top"><span id="pdfTopMsg">正在生成 PDF，请稍候…</span><button id="pdfClose" type="button">关闭</button></div>
  <div id="pdfDoc"></div>
</div>

<script>
"use strict";
/* ===== 八字命盘引擎（子平法，确定性推算，与完整版同一口径） =====
   年柱以立春交节时刻为界；月柱以十二节交节时刻定月建；
   日柱以 1900-01-01 甲戌日为锚、子初（23:00）换日；时柱五鼠遁。
   节气时刻由太阳视黄经推算。输入时间一律按北京时间理解。 */
var TIANGAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
var DIZHI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
var WUXING=["木","火","土","金","水"];
var STEM_ELEMENT={"甲":"木","乙":"木","丙":"火","丁":"火","戊":"土","己":"土","庚":"金","辛":"金","壬":"水","癸":"水"};
var WUXING_SHENG={"金":"水","水":"木","木":"火","火":"土","土":"金"};
var WUXING_KE={"金":"木","木":"土","土":"水","水":"火","火":"金"};
function stemYinYang(s){return TIANGAN.indexOf(s)%2===0?"阳":"阴";}
function elementOfStem(s){return STEM_ELEMENT[s]||"土";}
function elementThatGenerates(el){for(var k in WUXING_SHENG){if(WUXING_SHENG[k]===el)return k;}return "土";}
function elementThatControls(el){for(var k in WUXING_KE){if(WUXING_KE[k]===el)return k;}return "土";}
function shiShenOf(dayStem,other){
  var me=elementOfStem(dayStem),it=elementOfStem(other);
  var same=stemYinYang(dayStem)===stemYinYang(other);
  if(it===me)return same?"比肩":"劫财";
  if(WUXING_SHENG[it]===me)return same?"偏印":"正印";
  if(WUXING_SHENG[me]===it)return same?"食神":"伤官";
  if(WUXING_KE[me]===it)return same?"偏财":"正财";
  return same?"七杀":"正官";
}
var SHISHEN_DESC={"比肩":"自立、主见、同辈助力","劫财":"进取、竞争、合作与破耗并见","正印":"学识、贵人、庇护与名誉","偏印":"偏才、悟性、钻研冷门","食神":"才华、口福、温和生财","伤官":"聪明外露、创意、不喜拘束","正财":"勤俭务实、稳定收入、重家庭","偏财":"机变生财、人缘与横财意识","正官":"自律、责任、名声与职位","七杀":"魄力、压力、开创与竞争"};
var HIDDEN_STEMS={"子":["癸"],"丑":["己","癸","辛"],"寅":["甲","丙","戊"],"卯":["乙"],"辰":["戊","乙","癸"],"巳":["丙","庚","戊"],"午":["丁","己"],"未":["己","丁","乙"],"申":["庚","壬","戊"],"酉":["辛"],"戌":["戊","辛","丁"],"亥":["壬","甲"]};
var NAYIN=["海中金","炉中火","大林木","路旁土","剑锋金","山头火","涧下水","城头土","白腊金","杨柳木","泉中水","屋上土","霹雳火","松柏木","长流水","沙中金","山下火","平地木","壁上土","金箔金","覆灯火","天河水","大驿土","钗钏金","桑柘木","大溪水","沙中土","天上火","石榴木","大海水"];
function sexagenaryIndex(stem,branch){var s=TIANGAN.indexOf(stem),b=DIZHI.indexOf(branch);for(var i=0;i<60;i++){if(i%10===s&&i%12===b)return i;}return 0;}
function nayinOf(stem,branch){return NAYIN[Math.floor(sexagenaryIndex(stem,branch)/2)]||"";}
function ganzhiFromIndex(idx){var i=((idx%60)+60)%60;return{stem:TIANGAN[i%10],branch:DIZHI[i%12]};}
var WUHU_START={"甲":"丙","己":"丙","乙":"戊","庚":"戊","丙":"庚","辛":"庚","丁":"壬","壬":"壬","戊":"甲","癸":"甲"};
var WUSHU_START={"甲":"甲","己":"甲","乙":"丙","庚":"丙","丙":"戊","辛":"戊","丁":"庚","壬":"庚","戊":"壬","癸":"壬"};
var MONTH_BRANCH_ORDER=["寅","卯","辰","巳","午","未","申","酉","戌","亥","子","丑"];
function sunLongitude(ms){
  var jd=ms/86400000+2440587.5,T=(jd-2451545.0)/36525;
  var L0=280.46646+T*(36000.76983+0.0003032*T);L0=((L0%360)+360)%360;
  var M=357.52911+T*(35999.05029-0.0001537*T),Mr=M*Math.PI/180;
  var C=(1.914602-T*(0.004817+0.000014*T))*Math.sin(Mr)+(0.019993-0.000101*T)*Math.sin(2*Mr)+0.000289*Math.sin(3*Mr);
  var omega=125.04-1934.136*T;
  var lambda=L0+C-0.00569-0.00478*Math.sin(omega*Math.PI/180);
  return ((lambda%360)+360)%360;
}
function angDiff(lon,target){var d=lon-target;while(d>180)d-=360;while(d<-180)d+=360;return d;}
function solarTermMs(year,angle){
  var approx=Date.UTC(year,0,1)+((((angle-280+360)%360)+5)*86400000);
  var step=6*3600*1000,prevT=approx-15*86400000,prevDiff=angDiff(sunLongitude(prevT),angle);
  for(var t=prevT+step;t<=approx+15*86400000;t+=step){
    var d=angDiff(sunLongitude(t),angle);
    if(prevDiff<0&&d>=0){var a=prevT,b=t;for(var k=0;k<40;k++){var m=(a+b)/2;if(angDiff(sunLongitude(m),angle)<0)a=m;else b=m;}return (a+b)/2;}
    prevT=t;prevDiff=d;
  }
  return approx;
}
var JIE=[["小寒",285,"丑"],["立春",315,"寅"],["惊蛰",345,"卯"],["清明",15,"辰"],["立夏",45,"巳"],["芒种",75,"午"],["小暑",105,"未"],["立秋",135,"申"],["白露",165,"酉"],["寒露",195,"戌"],["立冬",225,"亥"],["大雪",255,"子"]];
function jieTableAround(year){
  var pts=[];
  [year-1,year,year+1].forEach(function(yy){JIE.forEach(function(j){pts.push({name:j[0],branch:j[2],ms:solarTermMs(yy,j[1])});});});
  pts.sort(function(a,b){return a.ms-b.ms;});
  return pts.filter(function(p,i){return i===0||Math.abs(p.ms-pts[i-1].ms)>86400000;});
}
var LUNAR_MONTH_NAMES=["正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","腊月"];
var LUNAR_DAY_NAMES=["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
var lunarFmt=null;
try{lunarFmt=new Intl.DateTimeFormat("zh-CN-u-ca-chinese",{year:"numeric",month:"numeric",day:"numeric"});}catch(e){}
function lunarPartsOf(y,m,d){
  if(!lunarFmt)return null;
  try{
    var parts=lunarFmt.formatToParts(new Date(Date.UTC(y,m-1,d,12)));
    var get=function(t){for(var i=0;i<parts.length;i++){if(parts[i].type===t)return parts[i].value;}return "";};
    var year=Number(get("relatedYear")||get("year")),day=Number(get("day")),monthName=get("month");
    if(!year||!day||!monthName)return null;
    return{year:year,monthName:monthName,day:day};
  }catch(e){return null;}
}
function lunarLabelOf(y,m,d){var p=lunarPartsOf(y,m,d);if(!p)return "";return "农历"+p.monthName+(LUNAR_DAY_NAMES[p.day-1]||(p.day+"日"));}
function lunarToSolar(year,month,day,leap){
  var target=(leap?"闰":"")+(LUNAR_MONTH_NAMES[month-1]||"");
  var start=Date.UTC(year-1,11,20);
  for(var i=0;i<420;i++){
    var dt=new Date(start+i*86400000);
    var gy=dt.getUTCFullYear(),gm=dt.getUTCMonth()+1,gd=dt.getUTCDate();
    var p=lunarPartsOf(gy,gm,gd);
    if(p&&p.year===year&&p.monthName===target&&p.day===day)return{y:gy,m:gm,d:gd};
  }
  return null;
}
var DAY_MASTER_DESC={"甲":"甲木如参天大树，正直向上、主意坚定，有领袖气，认准方向不易回头。","乙":"乙木如花草藤蔓，柔韧变通、亲和细腻，善借势成事，适应力强。","丙":"丙火如太阳之光，热情外放、光明磊落，感染力强，不喜藏着掖着。","丁":"丁火如灯烛之光，细腻专注、思虑周密，外柔内明，洞察人心。","戊":"戊土如高山厚土，稳重诚信、承载力强，慢而能久，值得托付。","己":"己土如田园之土，包容务实、善经营照料，细水长流。","庚":"庚金如刀剑之金，刚毅果断、重义气、执行力强，喜锤炼成器。","辛":"辛金如珠玉之金，精致敏锐、自尊心强，重品味与体面。","壬":"壬水如江河之水，胸怀宽广、机变善谋，能屈能伸、流动不居。","癸":"癸水如雨露之水，聪慧内敛、直觉敏锐，润物无声。"};
var GEJU_DESC={"正官格":"以正官立格，重规矩、名声与责任，利正途发展、职级晋升；喜印星护官、财星生官，最忌伤官见官、冲破官星。","七杀格":"以七杀立格，压力即动力，魄力与开创见长；喜食神制杀、印星化杀，忌财星党杀而日主无根难担。","正印格":"以正印立格，学识、名誉与贵人缘是底气；喜官星生印，忌财星坏印。","偏印格":"以偏印立格，偏才悟性与钻研见长，适合冷门专长立身；喜七杀生印，忌财星破印、枭神夺食。","正财格":"以正财立格，勤俭务实、稳定经营见长；喜食伤生财、官星护财，忌比劫争财。","偏财格":"以偏财立格，机变生财、人缘义气见长，适合经营流通之业；忌比劫夺财而无制化。","食神格":"以食神立格，才华、口福与温和生财见长；喜财星泄秀，忌偏印夺食。","伤官格":"以伤官立格，聪明外露、创意表达见长，不喜拘束；喜佩印收敛或生财流通，忌直接见官而无化解。","建禄格":"日主自临月令禄地（比肩当令），自立自强、靠自己打拼；喜财官食伤泄秀成局，忌再逢比劫争财。","羊刃格":"劫财当令（月刃），进取果决、行动力强；喜官杀制刃、食伤泄秀，忌刃旺无制而冲动破耗。"};
var TIANYI={"甲":["丑","未"],"戊":["丑","未"],"庚":["丑","未"],"乙":["子","申"],"己":["子","申"],"丙":["亥","酉"],"丁":["亥","酉"],"辛":["寅","午"],"壬":["卯","巳"],"癸":["卯","巳"]};
var WENCHANG={"甲":"巳","乙":"午","丙":"申","戊":"申","丁":"酉","己":"酉","庚":"亥","辛":"子","壬":"寅","癸":"卯"};
var TRIAD_TARGET={"申":{taohua:"酉",yima:"寅",huagai:"辰"},"子":{taohua:"酉",yima:"寅",huagai:"辰"},"辰":{taohua:"酉",yima:"寅",huagai:"辰"},"寅":{taohua:"卯",yima:"申",huagai:"戌"},"午":{taohua:"卯",yima:"申",huagai:"戌"},"戌":{taohua:"卯",yima:"申",huagai:"戌"},"巳":{taohua:"午",yima:"亥",huagai:"丑"},"酉":{taohua:"午",yima:"亥",huagai:"丑"},"丑":{taohua:"午",yima:"亥",huagai:"丑"},"亥":{taohua:"子",yima:"巳",huagai:"未"},"卯":{taohua:"子",yima:"巳",huagai:"未"},"未":{taohua:"子",yima:"巳",huagai:"未"}};
function fmtBJ(ms){var d=new Date(ms+8*3600*1000);var p=function(n){return String(n).padStart(2,"0");};return d.getUTCFullYear()+"年"+(d.getUTCMonth()+1)+"月"+d.getUTCDate()+"日 "+p(d.getUTCHours())+":"+p(d.getUTCMinutes());}

function computeBazi(input,now){
  now=now||new Date();
  var y=input.solar.y,mo=input.solar.m,d=input.solar.d;
  var hourKnown=input.hour!==null;
  var hh=hourKnown?input.hour:12;
  var birthMs=Date.UTC(y,mo-1,d,hh-8,input.minute);
  var jies=jieTableAround(y);
  var segStart=null,segEnd=null;
  for(var i=0;i<jies.length;i++){if(jies[i].ms<=birthMs){segStart=jies[i];segEnd=jies[i+1]||null;}}
  if(!segStart){segStart=jies[0]||{name:"小寒",branch:"丑",ms:birthMs};}
  var monthBranch=segStart.branch;
  var lichun=jies.filter(function(p){return p.name==="立春";});
  var gzYear=y,lichunThisYear=null;
  for(var li=0;li<lichun.length;li++){if(Math.abs(lichun[li].ms-Date.UTC(y,1,4))<40*86400000)lichunThisYear=lichun[li];}
  if(lichunThisYear&&birthMs<lichunThisYear.ms)gzYear=y-1;
  var yearStem=TIANGAN[(((gzYear-4)%10)+10)%10],yearBranch=DIZHI[(((gzYear-4)%12)+12)%12];
  var yinStem=WUHU_START[yearStem]||"丙";
  var monthOffset=Math.max(0,MONTH_BRANCH_ORDER.indexOf(monthBranch));
  var monthStem=TIANGAN[(TIANGAN.indexOf(yinStem)+monthOffset)%10];
  var dayShift=hh>=23?1:0;
  var dayUtc=Date.UTC(y,mo-1,d+dayShift);
  var days=Math.floor((dayUtc-Date.UTC(1900,0,1))/86400000);
  var dayIdx=(((days+10)%60)+60)%60;
  var dayStem=TIANGAN[dayIdx%10],dayBranch=DIZHI[dayIdx%12];
  var xunStart=dayIdx-(dayIdx%10),covered={};
  for(var xi=0;xi<10;xi++)covered[DIZHI[(xunStart+xi)%12]]=true;
  var kongWang=DIZHI.filter(function(b){return !covered[b];});
  var hourBranchIdx=Math.floor(((hh+1)%24)/2);
  var hourBranch=DIZHI[hourBranchIdx];
  var ziStem=WUSHU_START[dayStem]||"甲";
  var hourStem=TIANGAN[(TIANGAN.indexOf(ziStem)+hourBranchIdx)%10];
  var dm=dayStem,dmEl=elementOfStem(dm);
  function mkPillar(label,stem,branch){
    return{label:label,stem:stem,branch:branch,
      stemShiShen:label==="日柱"?"日主":shiShenOf(dm,stem),
      hidden:(HIDDEN_STEMS[branch]||[]).map(function(s,idx){return{stem:s,role:idx===0?"本气":idx===1?"中气":"余气",shiShen:shiShenOf(dm,s)};}),
      nayin:nayinOf(stem,branch),isDay:label==="日柱",kongWang:kongWang.indexOf(branch)>=0};
  }
  var pillars=[mkPillar("年柱",yearStem,yearBranch),mkPillar("月柱",monthStem,monthBranch),mkPillar("日柱",dayStem,dayBranch)];
  if(hourKnown)pillars.push(mkPillar("时柱",hourStem,hourBranch));
  var counts={"木":0,"火":0,"土":0,"金":0,"水":0};
  pillars.forEach(function(p){
    counts[elementOfStem(p.stem)]+=1;
    p.hidden.forEach(function(h,idx){counts[elementOfStem(h.stem)]+=(idx===0?1:0.5);});
  });
  var genEl=elementThatGenerates(dmEl);
  var support=counts[dmEl]+counts[genEl];
  var drain=(counts[WUXING_SHENG[dmEl]]||0)+(counts[WUXING_KE[dmEl]]||0)+(counts[elementThatControls(dmEl)]||0);
  var strengthScore=Math.round((support-drain)*10)/10;
  var monthMainEl=elementOfStem((HIDDEN_STEMS[monthBranch]||[])[0]||"");
  var deLing=monthMainEl===dmEl||monthMainEl===genEl;
  var strengthLabel=strengthScore>=3?"身强":strengthScore>=1.2?"偏强":strengthScore>-1.2?"中和":strengthScore>-3?"偏弱":"身弱";
  var strengthNote="帮身力量（同我"+dmEl+"＋生我"+genEl+"）"+support+" 分，克泄耗力量（我生、我克、克我）"+drain+" 分。生于"+segStart.name+"后、月建"+monthBranch+"（本气"+monthMainEl+"），日主"+(deLing?"得令":"不得令")+"。此为扶抑法简易量化，作取用参考；精细旺衰还须参通根、合化与调候。"+(hourKnown?"":" 时辰不详，时柱未计入力量。");
  var shengWo=WUXING_SHENG[dmEl],keWo=elementThatControls(dmEl),woKe=WUXING_KE[dmEl];
  var xiYong;
  if(strengthLabel==="身强"||strengthLabel==="偏强"){
    xiYong={xi:[shengWo,woKe,keWo],ji:[dmEl,genEl],note:"日主偏旺，喜"+shengWo+"泄秀、"+woKe+"耗身、"+keWo+"立规矩来疏导旺气；忌再添"+dmEl+"帮身、"+genEl+"生身助旺。"};
  }else if(strengthLabel==="身弱"||strengthLabel==="偏弱"){
    xiYong={xi:[genEl,dmEl],ji:[shengWo,woKe,keWo],note:"日主偏弱，喜"+genEl+"生扶、"+dmEl+"帮身补根气；忌"+shengWo+"泄身、"+woKe+"耗身、"+keWo+"克身再加负担。"};
  }else{
    xiYong={xi:[genEl,shengWo],ji:[],note:"日主中和，贵在五行流通有情：印星护身与食伤泄秀并行不悖，忌某一行独旺打破平衡，具体随大运流年再定。"};
  }
  if(["亥","子","丑"].indexOf(monthBranch)>=0){
    var clashF=xiYong.ji.indexOf("火")>=0;
    xiYong={xi:xiYong.xi.concat(xiYong.xi.indexOf("火")>=0?[]:["火"]),ji:xiYong.ji.filter(function(e){return e!=="火";}),
      note:xiYong.note+" 生于寒冬、命局偏寒，另喜火调候暖局（《穷通宝鉴》以调候为先）"+(clashF?"；火虽在扶抑上为忌，但寒局无火则万物不生，调候优先，故转列喜用，只是不宜独旺":"")+"。"};
  }
  if(["巳","午","未"].indexOf(monthBranch)>=0){
    var clashW=xiYong.ji.indexOf("水")>=0;
    xiYong={xi:xiYong.xi.concat(xiYong.xi.indexOf("水")>=0?[]:["水"]),ji:xiYong.ji.filter(function(e){return e!=="水";}),
      note:xiYong.note+" 生于盛夏、命局偏燥，另喜水调候润局（《穷通宝鉴》以调候为先）"+(clashW?"；水虽在扶抑上为忌，但盛夏无水则燥裂，调候优先，故转列喜用，只是不宜独旺":"")+"。"};
  }
  var monthMainStem=(HIDDEN_STEMS[monthBranch]||[])[0]||"戊";
  var monthMainShiShen=shiShenOf(dm,monthMainStem);
  var geJuName=monthMainShiShen==="比肩"?"建禄格":monthMainShiShen==="劫财"?"羊刃格":monthMainShiShen+"格";
  var geJu={name:geJuName,desc:GEJU_DESC[geJuName]||("月令"+monthBranch+"本气"+monthMainStem+"为"+monthMainShiShen+"，以"+monthMainShiShen+"立格，断命先看此格成败与喜忌。")};
  var branchList=pillars.map(function(p){return p.branch;});
  function pillarNameOf(b){return pillars.filter(function(p){return p.branch===b;}).map(function(p){return p.label.replace("柱","");}).join("、");}
  var shenSha=[];
  var tianyiAt=(TIANYI[dm]||[]).filter(function(b){return branchList.indexOf(b)>=0;});
  if(tianyiAt.length)shenSha.push({name:"天乙贵人",at:tianyiAt.map(function(b){return b+"（"+pillarNameOf(b)+"）";}).join("、"),desc:"命中带天乙贵人，遇事多有贵人提携、逢凶化吉（以日干查四支）。"});
  var wc=WENCHANG[dm]||"";
  if(wc&&branchList.indexOf(wc)>=0)shenSha.push({name:"文昌贵人",at:wc+"（"+pillarNameOf(wc)+"）",desc:"命带文昌，利读书考试、文书才艺，聪明好学。"});
  var seenTriad={};
  [["年支",yearBranch],["日支",dayBranch]].forEach(function(pair){
    var t=TRIAD_TARGET[pair[1]];if(!t)return;
    [["桃花（咸池）",t.taohua,"人缘与魅力见长，异性缘较旺，用情须专一得体。"],["驿马",t.yima,"主走动迁徙、奔波求利，动中取财，安定较晚。"],["华盖",t.huagai,"主聪慧孤高，与宗教、艺术、哲学有缘，宜以专长立身。"]].forEach(function(c){
      if(branchList.indexOf(c[1])>=0&&!seenTriad[c[0]+"-"+c[1]]){seenTriad[c[0]+"-"+c[1]]=true;shenSha.push({name:c[0]+"·以"+pair[0]+"查",at:c[1]+"（"+pillarNameOf(c[1])+"）",desc:c[2]});}
    });
  });
  var taiYuanStem=TIANGAN[(TIANGAN.indexOf(monthStem)+1)%10];
  var taiYuanBranch=DIZHI[(DIZHI.indexOf(monthBranch)+3)%12];
  var yangYear=TIANGAN.indexOf(yearStem)%2===0;
  var forward=yangYear?(input.gender==="男"):(input.gender==="女");
  var jieMs=forward?(segEnd?segEnd.ms:birthMs):segStart.ms;
  var daysToJie=Math.max(0,Math.abs(jieMs-birthMs)/86400000);
  var startAge=Math.round((daysToJie/3)*10)/10;
  var saYears=Math.floor(startAge),saMonths=Math.round((startAge-saYears)*12);
  var startAgeText="约 "+saYears+" 岁"+(saMonths?" "+saMonths+" 个月":"")+"起运";
  var monthIdx=sexagenaryIndex(monthStem,monthBranch);
  var steps=[];
  for(var si=1;si<=8;si++){
    var gz=ganzhiFromIndex(monthIdx+(forward?si:-si));
    var sAge=Math.round((startAge+(si-1)*10)*10)/10;
    steps.push({gz:gz.stem+gz.branch,stem:gz.stem,branch:gz.branch,stemShiShen:shiShenOf(dm,gz.stem),branchShiShen:shiShenOf(dm,(HIDDEN_STEMS[gz.branch]||[])[0]||"戊"),startAge:sAge,endAge:Math.round((sAge+10)*10)/10,startYear:y+Math.floor(sAge)});
  }
  var ageNow=(now.getTime()-birthMs)/(365.25*86400000);
  var currentIdx=-1;
  steps.forEach(function(s,idx){if(ageNow>=s.startAge)currentIdx=idx;});
  var nowMs=now.getTime(),nowBJ=new Date(nowMs+8*3600*1000);
  var gzNow=nowBJ.getUTCFullYear();
  if(nowMs<solarTermMs(gzNow,315))gzNow-=1;
  var liuNian=[];
  for(var yy=gzNow-1;yy<=gzNow+4;yy++){var lgz=ganzhiFromIndex(yy-4);liuNian.push({year:yy,gz:lgz.stem+lgz.branch,stemShiShen:shiShenOf(dm,lgz.stem),current:yy===gzNow});}
  return{
    pillars:pillars,hourKnown:hourKnown,
    dayMaster:dm,dayMasterElement:dmEl,dayMasterYinYang:stemYinYang(dm),dayMasterDesc:DAY_MASTER_DESC[dm]||"",
    counts:counts,strengthLabel:strengthLabel,strengthNote:strengthNote,deLing:deLing,
    xiYong:xiYong,geJu:geJu,shenSha:shenSha,
    taiYuan:taiYuanStem+taiYuanBranch,kongWang:kongWang,
    monthBranch:monthBranch,monthJieName:segStart.name,monthJieDateLabel:fmtBJ(segStart.ms)+" 交"+segStart.name,
    daYun:{dirText:(forward?"顺行":"逆行")+"（"+(yangYear?"阳年":"阴年")+"生"+input.gender+"命）",startAgeText:startAgeText,startAge:startAge,steps:steps,currentIdx:currentIdx},
    liuNian:liuNian,
    solarLabel:"公历 "+y+" 年 "+mo+" 月 "+d+" 日"+(hourKnown?(" "+String(hh).padStart(2,"0")+":"+String(input.minute).padStart(2,"0")):"（时辰不详）"),
    lunarLabel:lunarLabelOf(y,mo,d),
    pillarsLabel:pillars.map(function(p){return p.stem+p.branch;}).join(" ")
  };
}

var GROUP_OF={"正官":"官杀","七杀":"官杀","正印":"印星","偏印":"印星","食神":"食伤","伤官":"食伤","正财":"财星","偏财":"财星","比肩":"比劫","劫财":"比劫"};
var GROUP_TRAIT={"官杀":"命里官杀有力：做事有责任感、重规矩与体面，扛得住压力，也容易把弦给自己绷太紧。对规则与权威敬畏，适合在有章法的环境里凭职位和口碑往上走；要留意学会松弛，别把不属于自己的担子也往肩上揽。","印星":"命里印星有力：学习力、悟性与长辈缘是底气，遇事多有贵人点拨。心性偏静、重精神世界，做事喜欢先想明白再动手；短板是想得多、动得慢，拿定主意后就别再反复内耗。","食伤":"命里食伤有力：脑子活、表达欲强，有才华有主意，天生不喜欢被管束。适合靠手艺、口才、创意吃饭；短板是锋芒太露、耐心不足，对不认同的人容易不给面子，分寸感要刻意练。","财星":"命里财星有力：务实、会算账，对钱和机会敏感，做事以结果为导向。适合经营、业务、与资源打交道的路子；短板是容易只盯着眼前得失，让身体和家人给赚钱让路，要学会留白。","比劫":"命里比劫有力：自立自强、不服管，朋友同辈对你影响大，在团队里能扛事。短板是竞争心重、花钱大方讲义气，钱财上易有瓜分与破耗，亲兄弟也要明算账。"};
var MISSING_EL={"木":"命中不见木，少了些生发与规划的劲，做事容易缺长远布局；补法是把目标定下来、多亲近自然与向上生长的事。","火":"命中不见火，热情与表达偏弱，存在感容易被低估；补法是主动展示自己、多到热闹明亮的场合里去。","土":"命中不见土，落地的根基感偏弱，容易飘、难守成；补法是把财务与作息立成规矩，靠制度稳住自己。","金":"命中不见金，决断与边界感偏弱，做事容易拖泥带水；补法是学着立规矩、及时止损。","水":"命中不见水，变通与涵养偏弱，遇事容易走极端；补法是多读书、多走动，遇事留三分余地。"};
var ELEMENT_ORGAN={"木":"肝胆与筋骨","火":"心脑血管与眼睛","土":"脾胃与消化","金":"肺、呼吸道与皮肤","水":"肾、泌尿系统与腰"};
var ELEMENT_CAREER={"木":"木主生发，利教育培训、文化出版、医药养生、林业园艺、纺织服装等向上生长的行业，方位利东方","火":"火主光明，利能源电力、餐饮娱乐、传媒广告、电子网络、美容美业等热烈明亮的行业，方位利南方","土":"土主承载，利建筑地产、农业食品、仓储物流、物业服务、咨询中介等落地经营的行业，方位利本地扎根","金":"金主义革决断，利金融财务、机械汽车、五金电子、珠宝钟表、法律等讲规则与效率的行业，方位利西方","水":"水主流动，利航运物流、旅游商贸、信息流通、饮品酒水等流动变化的行业，方位利北方"};
var SPOUSE_PALACE={"比肩":"配偶自立有主见，婚姻像合伙过日子，凡事有商有量最好，较劲就伤和气。","劫财":"配偶个性强、行动力足，家里容易为钱和主导权拉扯，财务透明、边界清楚是相处关键。","正印":"配偶稳重顾家、有长辈缘，感情细水长流；把对方的付出看在眼里、说出口，别当理所当然。","偏印":"配偶有专长、想法独特，彼此都需要空间感，给对方留独处余地反而更亲近。","食神":"配偶温和好相处、懂生活情趣，感情氛围轻松，日子容易过得有滋有味。","伤官":"配偶聪明有才、个性鲜明，彼此欣赏才华是缘分；但说话都要留三分，言语最伤感情。","正财":"配偶务实勤俭、会过日子，感情落在柴米油盐里最踏实，也别忘了偶尔制造一点浪漫。","偏财":"配偶大方有人缘、社交活跃，感情热闹有活力；也要防外界诱惑，各自心里有数。","正官":"配偶端正可靠、有责任心，婚姻多得对方扶持，彼此尊重、给足体面最长久。","七杀":"配偶魄力强、气场足，感情来得浓烈；相处要学会服软与沟通，硬碰硬最伤感情。"};
var DAYUN_NOTE={"比肩":"与同辈并肩打拼的十年，自主性强，利合伙创业、靠本事吃饭；防同辈竞争与钱财瓜分，账目要清。","劫财":"进取与竞争并盛的十年，敢投敢闯、机会多，但破耗也多；合伙借贷格外谨慎，冲动消费是大忌。","食神":"才华与口福皆旺的十年，利凭手艺、表达、专业输出赚钱，心态松弛；宜把爱好做成收入。","伤官":"想法多、变化多的十年，利创意、技术突破与转型；不利与规则、上级硬碰，祸从口出最要防。","正财":"财来就我的十年，收入趋稳、利积累与置业，踏实经营胜过投机；感情也容易在这一运里定下来。","偏财":"活财涌动的十年，利经营、人脉与副业，机会财不少；钱来得快去得也快，留得住才是本事。","正官":"名声与职位上升的十年，利考试、晋升、进入大平台，责任随之加重；守规矩、重口碑，自有贵人推举。","七杀":"压力攻坚的十年，挑战大、成长也快，利在竞争中破局；注意劳逸与安全，别透支身体。","正印":"贵人与学业运旺的十年，利进修、考证、置业安家，长辈助力明显；忌过度依赖、行动力变弱。","偏印":"钻研与转型的十年，利冷门专长、学习新技、心性沉淀；易想多做少，定个小目标逼自己落地。"};
var LIUNIAN_NOTE={"比肩":"同辈与合作之事多，靠自己打拼，防钱财瓜分。","劫财":"竞争与破耗并见，投资合伙留个心眼。","食神":"才华有处使、口福不缺，适合把手艺和爱好变现。","伤官":"想法多、变动多，利转型与表达，忌与上级规则硬碰。","正财":"收入求稳、利积累，踏实经营自然进财。","偏财":"机会财、人脉财活跃，见好就收、留得住才算数。","正官":"利职位、考试与名声，守规矩自有推举。","七杀":"压力与挑战大，攻坚能出成绩，注意别透支身体。","正印":"贵人、学业、文书之年，利进修考证与安家。","偏印":"利钻研冷门专长，也容易想多做少，贵在落地。"};
function shishenScores(chart){
  var s={};
  function add(n,w){s[n]=(s[n]||0)+w;}
  chart.pillars.forEach(function(p){
    if(p.stemShiShen!=="日主")add(p.stemShiShen,1);
    p.hidden.forEach(function(h,i){add(h.shiShen,i===0?1:0.5);});
  });
  return s;
}
function groupScore(scores,g){var t=0;for(var k in scores){if(GROUP_OF[k]===g)t+=scores[k];}return t;}
function buildReading(chart,gender){
  var scores=shishenScores(chart),sections=[];
  var overview=[
    chart.dayMasterDesc+" 你生于"+chart.monthJieName+"之后、月建"+chart.monthBranch+"，日主"+chart.dayMaster+chart.dayMasterElement+"（"+chart.dayMasterYinYang+"），旺衰评为「"+chart.strengthLabel+"」，"+(chart.deLing?"生于当令之月，先天根气不弱":"虽不得月令，仍要看通根与帮扶")+"。",
    "本命以「"+chart.geJu.name+"」立格。"+chart.geJu.desc,
    chart.xiYong.note
  ];
  if(chart.shenSha.length)overview.push("命带神煞："+chart.shenSha.map(function(s){return s.name;}).join("、")+"，细目看下方神煞一节。");
  overview.push("胎元 "+chart.taiYuan+"，日柱旬空 "+chart.kongWang.join("、")+"（落空亡的宫位之事宜踏实落地，不宜寄望于虚）。");
  sections.push({title:"命格总览",paragraphs:overview});
  var groups=["官杀","印星","食伤","财星","比劫"].map(function(g){return{g:g,v:groupScore(scores,g)};}).sort(function(a,b){return b.v-a.v;});
  var traitParas=[],top=groups[0];
  if(top&&top.v>0)traitParas.push(GROUP_TRAIT[top.g]||"");
  var second=groups[1];
  if(second&&top&&second.v>=Math.max(1.5,top.v*0.6))traitParas.push("其次"+second.g+"也成气候："+(GROUP_TRAIT[second.g]||""));
  WUXING.filter(function(e){return (chart.counts[e]||0)===0;}).forEach(function(e){traitParas.push(MISSING_EL[e]||"");});
  if(traitParas.length===0)traitParas.push("命局十神分布较为均匀，性情不偏一端，可塑性强，随大运流年引动的方向变化而变化。");
  sections.push({title:"性格与禀赋",paragraphs:traitParas});
  var guan=groupScore(scores,"官杀"),cai=groupScore(scores,"财星"),shishang=groupScore(scores,"食伤"),career=[];
  if(guan>=2)career.push("官杀力量不弱，适合在正规平台、大机构或体制内凭职位与口碑往上走，扛得住考核与压力；自己创业也要先立规矩、把名分定清。");
  else if(guan===0)career.push("命中官杀不显，天生不太吃「被管」这一套，靠职位头衔驱动不明显，更适合凭本事、作品与口碑吃饭的路子，自由度比头衔重要。");
  else career.push("官杀有根，事业上有上进心、能担责，既能适应有章法的平台，也留有自己做主的余地，进退之间看大运引动。");
  if(cai>=2.5)career.push("财星旺而有力，赚钱的意识与能力都是强项，利经营、业务与资源运作；要防的是财多压身、为钱透支身体，比劫旺的年份尤其要防合伙瓜分。");
  else if(cai===0)career.push("财星不显于命局，不是没财，而是钱多要靠食伤生财、大运流年引动，或靠专业与职位换收入；年轻时先攒本事，比急着赚钱更划算。");
  else career.push("财星有根，收入以稳为主，靠踏实经营与专业积累慢慢做大，不是一夜暴富的路子，胜在细水长流。");
  if(shishang>=1.5&&cai>=1)career.push("食伤生财的路子是通的：把才华、表达、技术做成产品或服务，是你最顺的生财方式，越专业越值钱。");
  var xi0=chart.xiYong.xi[0]||"";
  if(xi0&&ELEMENT_CAREER[xi0])career.push("用神方向喜"+xi0+"："+ELEMENT_CAREER[xi0]+"。选行业、选城市方位时往这个方向靠，顺势更省力。");
  sections.push({title:"事业与财运",paragraphs:career});
  var spouseNames=gender==="男"?["正财","偏财"]:["正官","七杀"];
  var spouseScore=spouseNames.reduce(function(a,n){return a+(scores[n]||0);},0);
  var spouseLabel=gender==="男"?"财星":"官杀星",love=[];
  if(spouseScore===0)love.push(spouseLabel+"不见于天干与藏干，不是没有姻缘，而是缘分多要靠大运流年引动、或自己主动争取；晚定下来、或与异地之人结缘的情况也不少，感情上最忌将就。");
  else if(spouseScore<1.5)love.push(spouseLabel+"有根但不算旺，姻缘会自然到来，只是需要用心经营；别把精力全压在事业上，机会来了要接得住。");
  else love.push(spouseLabel+"旺而有力，异性缘与婚姻信号都比较明显，感情在人生里占的分量不轻；也要防选择太多或用情太急，真正定下来时慢一点、看清人。");
  var dayP=chart.pillars.filter(function(p){return p.isDay;})[0];
  var dayBranchMain=dayP&&dayP.hidden[0]?dayP.hidden[0].shiShen:"";
  if(dayBranchMain&&SPOUSE_PALACE[dayBranchMain])love.push("日支是配偶宫，本气为"+dayBranchMain+"："+SPOUSE_PALACE[dayBranchMain]);
  sections.push({title:"感情与婚姻",paragraphs:love});
  var sortedEl=WUXING.slice().sort(function(a,b){return (chart.counts[a]||0)-(chart.counts[b]||0);});
  var weakest=sortedEl[0],strongest=sortedEl[sortedEl.length-1];
  var health=["五行之中"+weakest+"最弱"+((chart.counts[weakest]||0)===0?"（命中全缺）":"")+"。传统五行把"+weakest+"对应到"+ELEMENT_ORGAN[weakest]+"，命理上多提示这一块先天底子相对薄、平时要多留意养护。"];
  if(strongest!==weakest&&(chart.counts[strongest]||0)-(chart.counts[weakest]||0)>=3)health.push(strongest+"最旺，旺极同样容易生负担，"+ELEMENT_ORGAN[strongest]+"别长期透支；作息与情绪的平衡，比任何补法都管用。");
  health.push("以上是传统五行对应的参详，不是医学判断；身体真有不舒服，及时就医检查，别拿命理代替诊断。");
  sections.push({title:"健康留意",paragraphs:health});
  var dayunNotes=chart.daYun.steps.map(function(s){
    var base=DAYUN_NOTE[s.stemShiShen]||"",el=elementOfStem(s.stem);
    var tail=chart.xiYong.xi.indexOf(el)>=0?" 此运天干又是命局所喜，顺势加分。":chart.xiYong.ji.indexOf(el)>=0?" 此运天干为命局所忌，宜稳守、少冒进。":"";
    return base+tail;
  });
  var dyParas=["大运"+chart.daYun.dirText+"，"+chart.daYun.startAgeText+"。大运十年一换，看的是每个十年人生舞台的天气：顺不顺大半看这步运的天干十神与你喜忌的关系，逐步细目在下方大运表里。"];
  var cur=chart.daYun.currentIdx>=0?chart.daYun.steps[chart.daYun.currentIdx]:null;
  if(cur){
    dyParas.push("你现在正走 "+cur.gz+" 大运（约 "+cur.startYear+" 年起，天干"+cur.stemShiShen+"、地支本气"+cur.branchShiShen+"）。"+(dayunNotes[chart.daYun.currentIdx]||""));
    var nxt=chart.daYun.steps[chart.daYun.currentIdx+1];
    if(nxt)dyParas.push("下一步是 "+nxt.gz+" 运（约 "+nxt.startYear+" 年起，"+nxt.stemShiShen+"当令），可以提前留意节奏的切换。");
  }else{
    dyParas.push("目前尚未交运（"+chart.daYun.startAgeText+"），童年少年阶段以月柱气象为运，论性情禀赋为主，不必急着论成败。");
  }
  sections.push({title:"大运走势",paragraphs:dyParas});
  var curLn=null;
  chart.liuNian.forEach(function(l){if(l.current)curLn=l;});
  if(curLn){
    var el2=elementOfStem(curLn.gz.charAt(0));
    var rel=chart.xiYong.xi.indexOf(el2)>=0?"流年天干正是命局所喜，这一年适合主动推进想做的事":chart.xiYong.ji.indexOf(el2)>=0?"流年天干为命局所忌，这一年宜稳守、重要决定多留余地":"流年与命局喜忌关系平平，按部就班即可";
    sections.push({title:"流年提示",paragraphs:[curLn.year+" 年是 "+curLn.gz+" 年，流年天干对你是「"+curLn.stemShiShen+"」："+(LIUNIAN_NOTE[curLn.stemShiShen]||"")+" "+rel+"。流年只是当年的天气，成事还要看大运的地基与自己的行动。"]});
  }
  return{sections:sections,dayunNotes:dayunNotes};
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
"use strict";
/* ===== 界面 ===== */
var EL_COLORS={"木":"#7fb069","火":"#d0573f","土":"#c9a86a","金":"#9aa5b1","水":"#6a8fc9"};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var state={gender:"",calendar:"公历"};
var $=function(id){return document.getElementById(id);};
/* 出生时间下拉：用点选代替系统时间输入框，任何手机浏览器都能选 */
(function(){
  var bh=$("bh"),bm=$("bm"),h='<option value="">时</option>',j;
  for(var i=0;i<24;i++)h+='<option value="'+i+'">'+(i<10?"0":"")+i+' 点</option>';
  bh.innerHTML=h;h='<option value="">分</option>';
  for(j=0;j<60;j++)h+='<option value="'+j+'">'+(j<10?"0":"")+j+' 分</option>';
  bm.innerHTML=h;
})();
/* 农历下拉 */
(function(){
  var lm=$("lm"),ld=$("ld"),h="";
  LUNAR_MONTH_NAMES.forEach(function(n,i){h+='<option value="'+(i+1)+'">'+n+'</option>';});
  lm.innerHTML=h;h="";
  LUNAR_DAY_NAMES.forEach(function(n,i){h+='<option value="'+(i+1)+'">'+n+'</option>';});
  ld.innerHTML=h;
})();
/* 页签 */
function setTab(which){
  var cast=which==="cast";
  $("tabCast").className=cast?"on":"";$("tabCast").setAttribute("aria-selected",cast);
  $("tabLearn").className=cast?"":"on";$("tabLearn").setAttribute("aria-selected",!cast);
  $("viewCast").className=cast?"":"hidden";
  $("viewLearn").className=cast?"hidden":"fade";
}
$("tabCast").addEventListener("click",function(){setTab("cast");});
$("tabLearn").addEventListener("click",function(){setTab("learn");});
function segPair(a,b,val){$(a).className=val?"on":"";$(b).className=val?"":"on";}
$("gF").addEventListener("click",function(){state.gender="女";segPair("gF","gM",true);});
$("gM").addEventListener("click",function(){state.gender="男";segPair("gF","gM",false);});
$("cG").addEventListener("click",function(){state.calendar="公历";segPair("cG","cN",true);$("solarBox").className="mt";$("lunarBox").className="mt hidden";});
$("cN").addEventListener("click",function(){state.calendar="农历";segPair("cG","cN",false);$("solarBox").className="mt hidden";$("lunarBox").className="mt";});
$("hu").addEventListener("change",function(){var off=$("hu").checked;$("bh").disabled=off;$("bm").disabled=off;});
function showErr(msg){var e=$("err");if(msg){e.textContent=msg;e.className="err";}else{e.textContent="";e.className="err hidden";}}
function getHour(){
  if($("hu").checked)return{hour:null,minute:0};
  var hv=$("bh").value,mv=$("bm").value;
  if(hv===""||mv==="")return{err:"请把出生时间的时和分都选好，或勾选「时辰不详」。"};
  return{hour:Number(hv),minute:Number(mv)};
}
$("castBtn").addEventListener("click",function(){
  showErr("");
  if(!state.gender){showErr("先选性别：男命、女命的大运顺逆不同，必须选。");return;}
  var ht=getHour();if(ht.err){showErr(ht.err);return;}
  var entered;
  if(state.calendar==="公历"){
    var parts=$("bd").value.split("-");
    var yy=Number(parts[0]),mm=Number(parts[1]),dd=Number(parts[2]);
    if(!yy||!mm||!dd){showErr("请把出生日期填完整。");return;}
    if(yy<1900||yy>2100){showErr("出生年份请在 1900–2100 之间。");return;}
    entered={name:$("nm").value.trim(),gender:state.gender,calendar:"公历",year:yy,month:mm,day:dd,leap:false,hour:ht.hour,minute:ht.minute};
  }else{
    var ly=Number($("ly").value);
    if(!ly||ly<1900||ly>2100){showErr("请填农历出生年份（1900–2100）。");return;}
    entered={name:$("nm").value.trim(),gender:state.gender,calendar:"农历",year:ly,month:Number($("lm").value),day:Number($("ld").value),leap:$("lleap").checked,hour:ht.hour,minute:ht.minute};
  }
  doCast(entered);
});
function doCast(entered){
  var solar={y:entered.year,m:entered.month,d:entered.day},convertedSolar="";
  if(entered.calendar==="农历"){
    var s=lunarToSolar(entered.year,entered.month,entered.day,entered.leap);
    if(!s){showErr("农历 "+entered.year+" 年"+(entered.leap?"闰":"")+(LUNAR_MONTH_NAMES[entered.month-1]||"")+(LUNAR_DAY_NAMES[entered.day-1]||"")+" 换算不出公历日期：请检查这一年是否有这个闰月、该月是否有这一天，或改用公历输入。");return;}
    solar=s;convertedSolar="已换算为公历 "+s.y+" 年 "+s.m+" 月 "+s.d+" 日";
  }
  var chart=computeBazi({solar:solar,hour:entered.hour,minute:entered.minute,gender:entered.gender});
  var reading=buildReading(chart,entered.gender);
  renderResult(chart,reading,entered,convertedSolar);
}
function renderResult(chart,reading,entered,convertedSolar){
  var maxCount=1;for(var k in chart.counts)maxCount=Math.max(maxCount,chart.counts[k]);
  var h='<div class="fade">';
  h+='<div class="pdf-bar"><button id="pdfBtn" type="button" class="btn-pdf">生成 PDF 报告</button><span id="pdfMsg" class="small" role="status"></span></div>';
  /* 命盘 */
  h+='<section class="card" aria-label="四柱命盘">';
  h+='<p class="small" style="margin:0">'+esc((entered.name?entered.name+" · ":"")+entered.gender+"命 · "+chart.solarLabel+(chart.lunarLabel?" · "+chart.lunarLabel:""))+'</p>';
  if(convertedSolar)h+='<p class="small" style="margin:2px 0 0">'+esc(convertedSolar)+'</p>';
  h+='<div class="pillars">';
  chart.pillars.forEach(function(p){
    h+='<div class="pillar'+(p.isDay?" day":"")+'">';
    h+='<p class="pl" style="margin:0">'+p.label+(p.kongWang?" · 空亡":"")+'</p>';
    h+='<p class="ss serif" style="margin:2px 0 0">'+p.stemShiShen+'</p>';
    h+='<p class="big stem serif" style="margin:0">'+p.stem+'</p>';
    h+='<p class="big serif" style="margin:0">'+p.branch+'</p>';
    h+='<div class="hid">';
    p.hidden.forEach(function(hd){h+='<p><b>'+hd.stem+'</b> '+hd.role+' · '+hd.shiShen+'</p>';});
    h+='</div><p class="ny" style="margin:6px 0 0">'+p.nayin+'</p></div>';
  });
  if(!chart.hourKnown){
    h+='<div class="pillar dash"><p class="pl" style="margin:0">时柱</p><p class="serif" style="font-size:22px;font-weight:700;color:var(--dim);margin:8px 0">不详</p><p style="font-size:11px;color:var(--dim);margin:0;line-height:1.5">时辰未知，时柱不排；晚年运与子女缘的判断会打折扣</p></div>';
  }
  h+='</div>';

var lastReport=null;
var PDF_SERIF="font-family:'Noto Serif SC','Songti SC','STSong',serif";
function pdfSec(title,inner){
  return '<div style="margin-top:22px;break-inside:avoid"><h3 style="'+PDF_SERIF+';font-size:19px;font-weight:900;margin:0 0 6px;color:#1d2129">'+esc(title)+'</h3>'+inner+'</div>';
}
function pdfPara(t){return '<p style="font-size:13.5px;line-height:1.8;margin:7px 0 0;color:#24272e">'+esc(t)+'</p>';}
function buildPdfHtml(chart,reading,entered,convertedSolar){
  var now=new Date();
  var dateStr=now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日";
  var h='<div style="width:760px;margin:0 auto;background:#ffffff;color:#1d2129;font-family:-apple-system,BlinkMacSystemFont,\'PingFang SC\',\'Microsoft YaHei\',sans-serif;padding:40px 44px 34px">';
  /* 抬头 */
  h+='<div style="text-align:center;border-bottom:2px solid #8a6d2f;padding-bottom:16px">';
  h+='<p style="'+PDF_SERIF+';font-size:27px;font-weight:900;margin:0;letter-spacing:4px">命 格 报 告</p>';
  h+='<p style="font-size:13px;color:#5f6459;margin:8px 0 0">'+esc((entered.name?entered.name+" · ":"")+entered.gender+"命 · "+chart.solarLabel+(chart.lunarLabel?" · "+chart.lunarLabel:""))+'</p>';
  if(convertedSolar)h+='<p style="font-size:12px;color:#5f6459;margin:3px 0 0">'+esc(convertedSolar)+'</p>';
  h+='</div>';
  /* 命盘表 */
  var cols=chart.pillars.slice();
  if(!chart.hourKnown)cols.push(null);
  var th='style="border:1px solid #d8d2c0;background:#f4f1e6;padding:7px 4px;font-size:13px;color:#5f6459';
  var td='style="border:1px solid #d8d2c0;padding:8px 4px;text-align:center;vertical-align:top';
  var tbl='<table style="width:100%;border-collapse:collapse;margin-top:14px;table-layout:fixed"><tr><th '+th+';width:56px"></th>';
  cols.forEach(function(p){tbl+='<th '+th+'">'+(p?(p.label+(p.kongWang?" · 空亡":"")):"时柱")+'</th>';});
  tbl+='</tr>';
  tbl+='<tr><th '+th+'">十神</th>'+cols.map(function(p){return '<td '+td+';font-size:13px;color:'+(p&&p.isDay?"#b03a2e;font-weight:700":"#5f6459")+'">'+(p?p.stemShiShen:"—")+'</td>';}).join("")+'</tr>';
  tbl+='<tr><th '+th+'">天干</th>'+cols.map(function(p){return '<td '+td+'"><span style="'+PDF_SERIF+';font-size:32px;font-weight:900;color:#8a6d2f;line-height:1.2">'+(p?p.stem:"？")+'</span></td>';}).join("")+'</tr>';
  tbl+='<tr><th '+th+'">地支</th>'+cols.map(function(p){return '<td '+td+'"><span style="'+PDF_SERIF+';font-size:32px;font-weight:900;line-height:1.2">'+(p?p.branch:"？")+'</span></td>';}).join("")+'</tr>';
  tbl+='<tr><th '+th+'">藏干</th>'+cols.map(function(p){
    if(!p)return '<td '+td+';font-size:12px;color:#5f6459">时辰不详</td>';
    return '<td '+td+';font-size:12px;line-height:1.65;text-align:left;padding-left:10px">'+p.hidden.map(function(hd){return '<b>'+hd.stem+'</b> '+hd.role+' · '+hd.shiShen;}).join("<br>")+'</td>';
  }).join("")+'</tr>';
  tbl+='<tr><th '+th+'">纳音</th>'+cols.map(function(p){return '<td '+td+';font-size:12px;color:#5f6459">'+(p?p.nayin:"—")+'</td>';}).join("")+'</tr>';
  tbl+='</table>';
  tbl+='<p style="font-size:12px;color:#5f6459;line-height:1.7;margin:10px 0 0">'+esc(chart.monthJieDateLabel)+'，月建'+chart.monthBranch+'。日主 <b style="color:#b03a2e">'+chart.dayMaster+chart.dayMasterElement+'</b>，旬空 '+chart.kongWang.join("、")+'，胎元 '+chart.taiYuan+'。</p>';
  h+=pdfSec("四柱命盘",tbl);
  /* 旺衰与五行 */
  var maxCount=1;for(var k in chart.counts)maxCount=Math.max(maxCount,chart.counts[k]);
  var wx='<p style="font-size:15px;margin:2px 0 0"><b style="'+PDF_SERIF+';font-size:21px;font-weight:900">日主'+esc(chart.strengthLabel)+'</b>　<span style="font-size:13px;background:#efeade;border-radius:99px;padding:2px 10px;font-weight:700">'+esc(chart.geJu.name)+'</span>　<span style="font-size:12px;color:#5f6459">'+(chart.deLing?"日主得令":"日主不得令")+'</span></p>';
  wx+='<table style="width:100%;border-collapse:collapse;margin-top:10px">';
  WUXING.forEach(function(e){
    var v=chart.counts[e]||0;
    wx+='<tr><td style="width:30px;padding:4px 0;font-size:14px;font-weight:700;color:'+EL_COLORS[e]+'">'+e+'</td><td style="padding:4px 8px"><div style="background:#efeade;height:12px;border-radius:99px"><div style="height:12px;border-radius:99px;width:'+Math.round(v/maxCount*100)+'%;background:'+EL_COLORS[e]+'"></div></div></td><td style="width:36px;text-align:right;font-size:12px;color:#5f6459">'+v+'</td></tr>';
  });
  wx+='</table>';
  wx+='<p style="font-size:12px;color:#5f6459;line-height:1.7;margin:8px 0 0">'+esc(chart.strengthNote)+'</p>';
  wx+='<p style="font-size:13px;margin:10px 0 0">喜用：'+chart.xiYong.xi.map(function(e){return '<b style="color:'+EL_COLORS[e]+'">'+e+'</b>';}).join("、")+(chart.xiYong.ji.length?('　忌：'+chart.xiYong.ji.map(function(e){return '<span style="color:'+EL_COLORS[e]+'">'+e+'</span>';}).join("、")):"")+'</p>';
  h+=pdfSec("旺衰与五行",wx);
  /* 解读 */
  reading.sections.forEach(function(s){
    h+=pdfSec(s.title,s.paragraphs.map(pdfPara).join(""));
  });
  /* 神煞 */
  var ss;
  if(chart.shenSha.length===0){
    ss=pdfPara("常见神煞（天乙贵人、文昌、桃花、驿马、华盖）未见落入四柱。神煞只是辅助参考，命格吉凶仍以格局与旺衰为主，不必强求。");
  }else{
    ss=chart.shenSha.map(function(s){return '<p style="font-size:13.5px;line-height:1.8;margin:7px 0 0;color:#24272e"><b>'+esc(s.name)+'</b><span style="color:#5f6459"> 在 '+esc(s.at)+'：</span>'+esc(s.desc)+'</p>';}).join("");
  }
  h+=pdfSec("神煞",ss);
  /* 大运 */
  var dy='<p style="font-size:12.5px;color:#5f6459;margin:2px 0 0">'+esc(chart.daYun.dirText)+' · '+esc(chart.daYun.startAgeText)+(chart.daYun.currentIdx<0?' · 尚未交运，交运前以月柱气象论运':'')+'</p>';
  dy+='<table style="width:100%;border-collapse:collapse;margin-top:10px"><tr><th '+th+';text-align:left;padding-left:10px">年龄</th><th '+th+'">干支</th><th '+th+'">天干</th><th '+th+'">地支本气</th><th '+th+';text-align:left;padding-left:10px">这步运</th></tr>';
  chart.daYun.steps.forEach(function(s,i){
    var cur=i===chart.daYun.currentIdx;
    var bg=cur?'background:#f7f1de;':'';
    dy+='<tr style="'+bg+'"><td '+td+';font-size:12.5px;text-align:left;padding-left:10px;white-space:nowrap">'+Math.floor(s.startAge)+'–'+Math.floor(s.endAge)+' 岁<br><span style="color:#5f6459">'+s.startYear+' 年起</span></td>'
      +'<td '+td+'"><span style="'+PDF_SERIF+';font-size:21px;font-weight:900;color:#8a6d2f">'+s.gz+'</span>'+(cur?'<br><span style="font-size:11px;color:#b03a2e;font-weight:700">当前大运</span>':'')+'</td>'
      +'<td '+td+';font-size:12.5px">'+s.stemShiShen+'</td><td '+td+';font-size:12.5px">'+s.branchShiShen+'</td>'
      +'<td '+td+';font-size:12px;line-height:1.65;text-align:left;padding-left:10px">'+esc(reading.dayunNotes[i]||"")+'</td></tr>';
  });
  dy+='</table>';
  h+=pdfSec("大运 · 十年一步",dy);
  /* 流年 */
  var ln='<p style="margin:4px 0 0;line-height:2.1">'+chart.liuNian.map(function(l){
    return '<span style="display:inline-block;border:1px solid '+(l.current?"#b03a2e":"#d8d2c0")+' ;border-radius:10px;padding:3px 12px;margin:0 6px 6px 0;font-size:13px;'+(l.current?"background:#f7f1de;":"")+'">'+l.year+(l.current?" · 今年":"")+' <b style="'+PDF_SERIF+';font-size:16px">'+l.gz+'</b> '+l.stemShiShen+'</span>';
  }).join("")+'</p>';
  ln+=pdfPara("以上解读按子平命理结合这张命盘逐项推得，帮你认清禀赋、顺势而为；命是禀赋，运是际遇，路怎么走，最终还是你自己拿主意。");
  h+=pdfSec("近年流年",ln);
  /* 落款 */
  h+='<div style="border-top:1px solid #d8d2c0;margin-top:26px;padding-top:10px;font-size:11.5px;color:#8a8d84;display:flex;justify-content:space-between"><span>算命格系统（分享版）</span><span>报告生成于 '+dateStr+'</span></div>';
  h+='</div>';
  return h;
}
function loadPdfLib(cb){
  if(window.html2pdf){cb(true);return;}
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js";
  s.onload=function(){cb(!!window.html2pdf);};
  s.onerror=function(){cb(false);};
  document.head.appendChild(s);
}
function generatePdf(){
  if(!lastReport)return;
  var msg=$("pdfMsg"),btn=$("pdfBtn");
  btn.disabled=true;msg.textContent="正在准备…";
  loadPdfLib(function(ok){
    if(!ok){
      btn.disabled=false;
      msg.textContent="PDF 组件没能加载（需要联网），请检查网络后重新点一次。";
      return;
    }
    var root=$("pdfRoot"),doc=$("pdfDoc");
    $("pdfTopMsg").textContent="正在生成 PDF，请稍候…";
    doc.innerHTML=buildPdfHtml(lastReport.chart,lastReport.reading,lastReport.entered,lastReport.convertedSolar);
    root.className="";root.scrollTop=0;
    msg.textContent="正在生成 PDF…";
    var fname="命格报告-"+(lastReport.entered.name||lastReport.chart.pillarsLabel.replace(/ /g,""))+".pdf";
    var opt={margin:[12,10,14,10],filename:fname,image:{type:"jpeg",quality:0.96},
      html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",logging:false},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["css","legacy"]}};
    html2pdf().set(opt).from(doc.firstChild).save().then(function(){
      root.className="hidden";doc.innerHTML="";
      btn.disabled=false;
      msg.textContent="PDF 已生成："+fname+"（请在浏览器下载中查看，也可直接转发这个文件）。";
    }).catch(function(){
      root.className="hidden";doc.innerHTML="";
      btn.disabled=false;
      msg.textContent="这次生成没成功，请再点一次试试。";
    });
  });
}
$("pdfClose").addEventListener("click",function(){
  $("pdfRoot").className="hidden";$("pdfDoc").innerHTML="";
  var btn=$("pdfBtn");if(btn)btn.disabled=false;
});

/* ===== 学理 ===== */
(function(){
  var sections=[
    {title:"这个系统怎么排盘",body:[
      "年柱以立春交节的精确时刻为界：立春之前出生，算上一年。月柱以十二节（立春、惊蛰、清明、立夏、芒种、小暑、立秋、白露、寒露、立冬、大雪、小寒）交节时刻定月建，节气时刻由太阳黄经推算，与天文台公布值误差在几分钟内。所以同样是 2 月 4 日出生，立春前后的两个人年柱、月柱都可能不同。",
      "日柱按干支纪日推算，子初（23:00）换日：23 点后出生，日柱作次日、时柱作子时，这是子平通行口径之一。时柱按日干五鼠遁推出。出生时间一律按北京时间理解。",
      "时辰不详时只排年月日三柱：日主、格局、大运都不受影响，但时柱主晚年运与子女缘，这部分判断会打折扣，五行力量也不计时柱。"]},
    {title:"日主、旺衰与喜忌",body:[
      "日柱的天干就是日主，代表你自己。断命第一步看日主旺还是弱：生于当令之月（得令）、有同类与印星帮扶（得势得生）则旺；被克泄耗围困则弱。本系统用扶抑法简易量化（帮身力量对克泄耗力量）给出偏强、中和、偏弱的判断，并把算法写在命盘下方，供你核对——它是入门尺，不是定论，合化、通根、调候都会修正精细旺衰。",
      "喜忌是旺衰的对策：身旺喜克泄耗来疏导，身弱喜生扶来补根；寒冬生人另喜火暖局、盛夏生人另喜水润局，叫调候。喜用对应的五行、方位、行业，是顺势时最先考虑的方向。"]},
    {title:"大运怎么看",body:[
      "大运从月柱排起：阳年（年干为甲丙戊庚壬）生的男命、阴年生的女命顺行，余者逆行，十年一步。起运岁数按出生到相邻节的天数折算：三天折一年，一天折四个月，所以每个人的交运时间都不同。",
      "看一步大运，先看天干十神定这十年的主题（见每步运的注脚），再看它是不是命局所喜：喜运顺势加分，忌运就稳守少冒进。大运是天气，命局是地形，流年是当日的风雨——三层叠着看，才是完整的运势读法。"]},
    {title:"神煞的用法",body:[
      "天乙贵人主贵人提携逢凶化吉，文昌利学业文书，桃花主人缘魅力，驿马主走动迁徙，华盖主聪慧孤高与玄学艺术之缘。神煞是古人总结的辅助标记，只作参考：吉煞落空亡则力减，凶局里有吉煞也只是多一条出路，断命始终以格局、旺衰、喜忌为主。"]}
  ];
  var h="";
  sections.forEach(function(s){
    h+='<section class="card" aria-label="'+esc(s.title)+'"><h3 class="sec serif">'+esc(s.title)+'</h3>';
    s.body.forEach(function(p){h+='<p class="para">'+esc(p)+'</p>';});
    h+='</section>';
  });
  h+='<section class="card" aria-label="十神速查"><h3 class="sec serif">十神速查（以日主为「我」）</h3>';
  for(var k in SHISHEN_DESC){h+='<p class="para" style="margin-top:6px"><b class="serif">'+k+'</b><span style="color:var(--dim)">：'+SHISHEN_DESC[k]+'</span></p>';}
  h+='<p class="small" style="margin-top:12px">生我者为印（同阴阳偏印、异阴阳正印），同我者为比劫，我生者为食伤，我克者为财，克我者为官杀。五行相生：木生火、火生土、土生金、金生水、水生木；相克：木克土、土克水、水克火、火克金、金克木。</p></section>';
  $("viewLearn").innerHTML=h;
