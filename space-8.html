<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>算命格系统（分享版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  color-scheme: light;
  --bg:#e9e7de; --surface:#f7f4ec; --surface2:#efeade;
  --text:#1d2129; --dim:#5f6459; --border:#d5cfbc;
  --accent:#8a6d2f; --accent2:#b03a2e; --gold:#8a6d2f;
  --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#101319; --surface:#181d27; --surface2:#202634;
    --text:#e8e4da; --dim:#9aa1b0; --border:#2a3040;
    --accent:#c9a86a; --accent2:#d0573f; --gold:#c9a86a;
    --on-accent:#101319;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.55}
.serif{font-family:"Noto Serif SC","Songti SC","STSong",serif}
main{max-width:680px;margin:0 auto;padding:0 16px 44px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:4px;margin-top:16px}
.tabs button{flex:1;border:0;background:transparent;color:var(--dim);font-size:14px;font-weight:700;padding:10px 8px;border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--on-accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:16px}
.intro{font-size:14px;color:var(--dim);line-height:1.7;margin:16px 2px 0}
label.lab,.lab{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
input,select{width:100%;margin-top:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;padding:10px 12px;font-size:16px;outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--accent)}
select:disabled{opacity:.45}
.seg{display:flex;gap:4px;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:4px;margin-top:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--dim);font-size:14px;font-weight:700;padding:8px 6px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mt{margin-top:12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.err{margin-top:12px;font-size:14px;font-weight:700;color:var(--accent2)}
.btn-main{width:100%;margin-top:16px;border:0;background:var(--accent2);color:#fff;font-size:16px;font-weight:700;padding:13px;border-radius:12px;cursor:pointer}
.btn-main:active{opacity:.8}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .45s ease both}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pillar{border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center}
.pillar.day{border-color:var(--accent2);background:var(--surface2)}
.pillar .pl{font-size:12px;color:var(--dim)}
.pillar .ss{font-size:12px;margin-top:2px;color:var(--dim)}
.pillar.day .ss{color:var(--accent2);font-weight:700}
.pillar .big{font-size:36px;font-weight:900;line-height:1.15;color:var(--text)}
.pillar .big.stem{color:var(--gold)}
.pillar .hid{border-top:1px solid var(--border);margin-top:6px;padding-top:6px;display:flex;flex-direction:column;gap:2px}
.pillar .hid p{margin:0;font-size:11px;line-height:1.3;color:var(--dim)}
.pillar .hid b{color:var(--text)}
.pillar .ny{font-size:11px;color:var(--dim);margin-top:6px}
.pillar.dash{border-style:dashed;display:flex;flex-direction:column;justify-content:center}
.meta{font-size:12px;color:var(--dim);line-height:1.7;margin-top:12px}
.meta b{color:var(--accent2)}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.bar-row .en{width:24px;font-size:14px;font-weight:700}
.bar-track{flex:1;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar-fill{height:100%;border-radius:99px}
.bar-row .val{width:32px;text-align:right;font-size:12px;color:var(--dim)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff}
.pill.outline{background:transparent;border:1px solid}
.chip{display:inline-block;border-radius:99px;background:var(--surface2);padding:4px 10px;font-size:12px;font-weight:700}
h3.sec{font-size:18px;margin:0 0 4px}
p.para{font-size:14px;line-height:1.75;margin:8px 0 0}
.dy{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:8px}
.dy.cur{border-color:var(--accent2);background:var(--surface2)}
.dy .top{display:flex;align-items:center;gap:12px}
.dy .age{width:86px;flex-shrink:0}
.dy .age p{margin:0;font-size:14px;font-weight:700}
.dy .age span{font-size:12px;color:var(--dim)}
.dy .gz{font-size:28px;font-weight:900;color:var(--gold)}
.dy .ss2{font-size:12px;color:var(--dim);line-height:1.5}
.cur-badge{margin-left:auto;border-radius:99px;background:var(--accent2);color:#fff;padding:2px 10px;font-size:12px;font-weight:700}
.ln-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ln{border:1px solid var(--border);border-radius:12px;padding:8px 12px;text-align:center}
.ln.cur{border-color:var(--accent2);background:var(--surface2)}
.ln p{margin:0}
.ln .y{font-size:12px;color:var(--dim)}
.ln .g{font-size:20px;font-weight:900}
.ln .s{font-size:12px;color:var(--dim)}
.small{font-size:12px;color:var(--dim);line-height:1.7}
.hidden{display:none}
.pdf-bar{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn-pdf{border:0;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer}
.btn-pdf:active{opacity:.8}
.btn-pdf:disabled{opacity:.55;cursor:default}
#pdfRoot{position:fixed;inset:0;overflow-y:auto;background:#e9e7de;z-index:60;padding:16px 10px 34px}
#pdfRoot.hidden{display:none}
.pdf-top{max-width:760px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;color:#1d2129}
.pdf-top button{border:1px solid #d5cfbc;background:#fff;color:#1d2129;border-radius:10px;padding:6px 16px;font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="tabs" role="tablist" aria-label="功能切换">
    <button id="tabCast" class="on" role="tab" aria-selected="true">排命盘</button>
    <button id="tabLearn" role="tab" aria-selected="false">学理</button>
  </div>

  <div id="viewCast">
    <p class="intro">子平八字：报上出生年月日时，排出四柱命盘，看日主旺衰、格局喜忌、神煞与一生大运流年。时间按北京时间，节气按精确交节时刻排。</p>

    <section class="card" aria-label="报生辰" style="margin-top:12px">
      <div class="grid2">
        <div>
          <label class="lab" for="nm">称呼（可空）</label>
          <input id="nm" placeholder="如：我、妈妈、宝宝" autocomplete="off" />
        </div>
        <div>
          <span class="lab" id="gender-label">性别（定大运顺逆）</span>
          <div class="seg" role="group" aria-labelledby="gender-label">
            <button id="gF" type="button">女命</button>
            <button id="gM" type="button">男命</button>
          </div>
        </div>
      </div>

      <div class="mt">
        <span class="lab" id="cal-label">生日历法</span>
        <div class="seg" role="group" aria-labelledby="cal-label">
          <button id="cG" type="button" class="on">公历（阳历）</button>
          <button id="cN" type="button">农历（阴历）</button>
        </div>
      </div>

      <div id="solarBox" class="mt">
        <label class="lab" for="bd">出生日期</label>
        <input id="bd" type="date" min="1900-01-01" max="2100-12-31" />
      </div>

      <div id="lunarBox" class="mt hidden">
        <div class="grid3">
          <div>
            <label class="lab" for="ly">农历年</label>
            <input id="ly" inputmode="numeric" placeholder="如 1990" />
          </div>
          <div>
            <label class="lab" for="lm">月</label>
            <select id="lm"></select>
          </div>
          <div>
            <label class="lab" for="ld">日</label>
            <select id="ld"></select>
          </div>
        </div>
        <label class="check mt"><input type="checkbox" id="lleap" />这一年这个月是闰月（如闰六月就选六月再勾此项）</label>
      </div>

      <div class="grid2 mt" style="align-items:end">
        <div>
          <span class="lab" id="bt-label">出生时间（点选时、分）</span>
          <div class="grid2" style="gap:8px" role="group" aria-labelledby="bt-label">
            <select id="bh" aria-label="出生时间：时"></select>
            <select id="bm" aria-label="出生时间：分"></select>
          </div>
        </div>
        <label class="check" style="padding-bottom:12px"><input type="checkbox" id="hu" />时辰不详（只排三柱）</label>
      </div>

      <p id="err" class="err hidden" role="alert"></p>
      <button id="castBtn" class="btn-main" type="button">排命盘</button>
    </section>

    <div id="result"></div>
  </div>

  <div id="viewLearn" class="hidden"></div>
</main>

<div id="pdfRoot" class="hidden" role="dialog" aria-label="PDF 生成">
  <div class="pdf-top"><span id="pdfTopMsg">正在生成 PDF，请稍候…</span><button id="pdfClose" type="button">关闭</button></div>
  <div id="pdfDoc"></div>
</div>

<script>
"use strict";
/* ===== 八字命盘引擎（子平法，确定性推算，与完整版同一口径） =====
   年柱以立春交节时刻为界；月柱以十二节交节时刻定月建；
   日柱以 1900-01-01 甲戌日为锚、子初（23:00）换日；时柱五鼠遁。
   节气时刻由太阳视黄经推算。输入时间一律按北京时间理解。 */
var TIANGAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
var DIZHI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
var WUXING=["木","火","土","金","水"];
var STEM_ELEMENT={"甲":"木","乙":"木","丙":"火","丁":"火","戊":"土","己":"土","庚":"金","辛":"金","壬":"水","癸":"水"};
var WUXING_SHENG={"金":"水","水":"木","木":"火","火":"土","土":"金"};
var WUXING_KE={"金":"木","木":"土","土":"水","水":"火","火":"金"};
function stemYinYang(s){return TIANGAN.indexOf(s)%2===0?"阳":"阴";}
function elementOfStem(s){return STEM_ELEMENT[s]||"土";}
function elementThatGenerates(el){for(var k in WUXING_SHENG){if(WUXING_SHENG[k]===el)return k;}return "土";}
function elementThatControls(el){for(var k in WUXING_KE){if(WUXING_KE[k]===el)return k;}return "土";}
function shiShenOf(dayStem,other){
  var me=elementOfStem(dayStem),it=elementOfStem(other);
  var same=stemYinYang(dayStem)===stemYinYang(other);
  if(it===me)return same?"比肩":"劫财";
  if(WUXING_SHENG[it]===me)return same?"偏印":"正印";
  if(WUXING_SHENG[me]===it)return same?"食神":"伤官";
  if(WUXING_KE[me]===it)return same?"偏财":"正财";
  return same?"七杀":"正官";
}
var SHISHEN_DESC={"比肩":"自立、主见、同辈助力","劫财":"进取、竞争、合作与破耗并见","正印":"学识、贵人、庇护与名誉","偏印":"偏才、悟性、钻研冷门","食神":"才华、口福、温和生财","伤官":"聪明外露、创意、不喜拘束","正财":"勤俭务实、稳定收入、重家庭","偏财":"机变生财、人缘与横财意识","正官":"自律、责任、名声与职位","七杀":"魄力、压力、开创与竞争"};
var HIDDEN_STEMS={"子":["癸"],"丑":["己","癸","辛"],"寅":["甲","丙","戊"],"卯":["乙"],"辰":["戊","乙","癸"],"巳":["丙","庚","戊"],"午":["丁","己"],"未":["己","丁","乙"],"申":["庚","壬","戊"],"酉":["辛"],"戌":["戊","辛","丁"],"亥":["壬","甲"]};
var NAYIN=["海中金","炉中火","大林木","路旁土","剑锋金","山头火","涧下水","城头土","白腊金","杨柳木","泉中水","屋上土","霹雳火","松柏木","长流水","沙中金","山下火","平地木","壁上土","金箔金","覆灯火","天河水","大驿土","钗钏金","桑柘木","大溪水","沙中土","天上火","石榴木","大海水"];
function sexagenaryIndex(stem,branch){var s=TIANGAN.indexOf(stem),b=DIZHI.indexOf(branch);for(var i=0;i<60;i++){if(i%10===s&&i%12===b)return i;}return 0;}
function nayinOf(stem,branch){return NAYIN[Math.floor(sexagenaryIndex(stem,branch)/2)]||"";}
function ganzhiFromIndex(idx){var i=((idx%60)+60)%60;return{stem:TIANGAN[i%10],branch:DIZHI[i%12]};}
var WUHU_START={"甲":"丙","己":"丙","乙":"戊","庚":"戊","丙":"庚","辛":"庚","丁":"壬","壬":"壬","戊":"甲","癸":"甲"};
var WUSHU_START={"甲":"甲","己":"甲","乙":"丙","庚":"丙","丙":"戊","辛":"戊","丁":"庚","壬":"庚","戊":"壬","癸":"壬"};
var MONTH_BRANCH_ORDER=["寅","卯","辰","巳","午","未","申","酉","戌","亥","子","丑"];
function sunLongitude(ms){
  var jd=ms/86400000+2440587.5,T=(jd-2451545.0)/36525;
  var L0=280.46646+T*(36000.76983+0.0003032*T);L0=((L0%360)+360)%360;
  var M=357.52911+T*(35999.05029-0.0001537*T),Mr=M*Math.PI/180;
  var C=(1.914602-T*(0.004817+0.000014*T))*Math.sin(Mr)+(0.019993-0.000101*T)*Math.sin(2*Mr)+0.000289*Math.sin(3*Mr);
  var omega=125.04-1934.136*T;
  var lambda=L0+C-0.00569-0.00478*Math.sin(omega*Math.PI/180);
  return ((lambda%360)+360)%360;
}
function angDiff(lon,target){var d=lon-target;while(d>180)d-=360;while(d<-180)d+=360;return d;}
function solarTermMs(year,angle){
  var approx=Date.UTC(year,0,1)+((((angle-280+360)%360)+5)*86400000);
  var step=6*3600*1000,prevT=approx-15*86400000,prevDiff=angDiff(sunLongitude(prevT),angle);
  for(var t=prevT+step;t<=approx+15*86400000;t+=step){
    var d=angDiff(sunLongitude(t),angle);
    if(prevDiff<0&&d>=0){var a=prevT,b=t;for(var k=0;k<40;k++){var m=(a+b)/2;if(angDiff(sunLongitude(m),angle)<0)a=m;else b=m;}return (a+b)/2;}
    prevT=t;prevDiff=d;
  }
  return approx;
}
var JIE=[["小寒",285,"丑"],["立春",315,"寅"],["惊蛰",345,"卯"],["清明",15,"辰"],["立夏",45,"巳"],["芒种",75,"午"],["小暑",105,"未"],["立秋",135,"申"],["白露",165,"酉"],["寒露",195,"戌"],["立冬",225,"亥"],["大雪",255,"子"]];
function jieTableAround(year){
  var pts=[];
  [year-1,year,year+1].forEach(function(yy){JIE.forEach(function(j){pts.push({name:j[0],branch:j[2],ms:solarTermMs(yy,j[1])});});});
  pts.sort(function(a,b){return a.ms-b.ms;});
  return pts.filter(function(p,i){return i===0||Math.abs(p.ms-pts[i-1].ms)>86400000;});
}
var LUNAR_MONTH_NAMES=["正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","腊月"];
var LUNAR_DAY_NAMES=["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
var lunarFmt=null;
try{lunarFmt=new Intl.DateTimeFormat("zh-CN-u-ca-chinese",{year:"numeric",month:"numeric",day:"numeric"});}catch(e){}
function lunarPartsOf(y,m,d){
  if(!lunarFmt)return null;
  try{
    var parts=lunarFmt.formatToParts(new Date(Date.UTC(y,m-1,d,12)));
    var get=function(t){for(var i=0;i<parts.length;i++){if(parts[i].type===t)return parts[i].value;}return "";};
    var year=Number(get("relatedYear")||get("year")),day=Number(get("day")),monthName=get("month");
    if(!year||!day||!monthName)return null;
    return{year:year,monthName:monthName,day:day};
  }catch(e){return null;}
}
function lunarLabelOf(y,m,d){var p=lunarPartsOf(y,m,d);if(!p)return "";return "农历"+p.monthName+(LUNAR_DAY_NAMES[p.day-1]||(p.day+"日"));}
function lunarToSolar(year,month,day,leap){
  var target=(leap?"闰":"")+(LUNAR_MONTH_NAMES[month-1]||"");
  var start=Date.UTC(year-1,11,20);
  for(var i=0;i<420;i++){
    var dt=new Date(start+i*86400000);
    var gy=dt.getUTCFullYear(),gm=dt.getUTCMonth()+1,gd=dt.getUTCDate();
    var p=lunarPartsOf(gy,gm,gd);
    if(p&&p.year===year&&p.monthName===target&&p.day===day)return{y:gy,m:gm,d:gd};
  }
  return null;
}
var DAY_MASTER_DESC={"甲":"甲木如参天大树，正直向上、主意坚定，有领袖气，认准方向不易回头。","乙":"乙木如花草藤蔓，柔韧变通、亲和细腻，善借势成事，适应力强。","丙":"丙火如太阳之光，热情外放、光明磊落，感染力强，不喜藏着掖着。","丁":"丁火如灯烛之光，细腻专注、思虑周密，外柔内明，洞察人心。","戊":"戊土如高山厚土，稳重诚信、承载力强，慢而能久，值得托付。","己":"己土如田园之土，包容务实、善经营照料，细水长流。","庚":"庚金如刀剑之金，刚毅果断、重义气、执行力强，喜锤炼成器。","辛":"辛金如珠玉之金，精致敏锐、自尊心强，重品味与体面。","壬":"壬水如江河之水，胸怀宽广、机变善谋，能屈能伸、流动不居。","癸":"癸水如雨露之水，聪慧内敛、直觉敏锐，润物无声。"};

  else{
    var spTier=spouseScore>=4?"极旺":spouseScore>=2.5?"旺而有力":spouseScore>=1.5?"中等偏旺":spouseScore>=1?"有根可寻、力量尚浅":"仅余气潜伏、信号很淡";
    var spRootTxt=spouseInfo.level==="透干无根"?"星透在天干却无根：信号看得见、来得也不算晚，但关系容易热得快、落得慢，定下来需要时间与共同事务来扎根，别用投入的速度代替了解的深度。":spouseInfo.level==="透干有根"?"星透干又有根：信号明、落点实，感情多半不是虚晃一枪，遇上合适的人推进会相对顺。":spouseInfo.level==="藏支本气"?"星不透天干、只藏于地支本气：姻缘不张扬而实，多在稳定的生活与工作圈里自然发生，质地重于声势，慢热而能久。":spouseInfo.level==="仅藏中余气"?"星只藏在中余气里：信号潜伏，日常异性缘不算外显，要等运年引动或特定场合才会显形，主动创造相遇比被动等更有效。":"星有根可寻，姻缘会自然到来，只是分量不算压倒一切，需要用心经营、机会来了要接得住。";

    var spWeakTxt=weak2&&spouseScore>=2.5?"日主"+chart.strengthLabel+"而配偶星已"+spTier+"，还要多一层提醒：对方与关系容易在生活里占过大的权重，你容易为迁就而丢了自己的节奏，亲密之外保住工作、朋友与独处，才是长久之道。":strong2&&spouseScore>=1.5?"日主"+chart.strengthLabel+"、配偶星也有分量，是两边都强的相处格局：好处是能并肩，功课是别把家里也过成竞争场。":"";
    love.push(spouseLabel+"合计 "+fmtScore(spouseScore)+" 分（"+spTier+"），构成上"+spouseComp+"，根气为"+spouseInfo.level+"，落点为："+spouseOcc+"。"+spKindTxt+spRootTxt+spWeakTxt+spouseXiJi);

    if(gender==="男"&&(scores["正财"]||0)>0&&(scores["偏财"]||0)>0)love.push("男命正财与偏财并见（正财 "+fmtScore(scores["正财"])+" 分、偏财 "+fmtScore(scores["偏财"])+" 分，落点："+spouseOcc+"）：正财主正缘与安稳经营，偏财主人缘与机会缘，两者同局时桃花与正缘容易混在一起。分辨的方法很实际：愿意与你谈钱、谈时间、谈未来安排的是正缘，只在热闹与情绪里出现的，多半只是偏财式的心动。");

    else if(chart.xiYong.ji.indexOf(dayEl)>=0)palaceExtra.push("配偶宫本气属"+dayEl+"、是命局所忌，亲密关系容易成为消耗源，更要慎选、慢定，婚后也要保住各自的空间与节奏。");
    love.push("日支"+dayP.branch+"是配偶宫，本气为"+dayBranchMain+"："+SPOUSE_PALACE[dayBranchMain]+(palaceExtra.length?palaceExtra.join(""):""));

  he.chong.forEach(function(x){if(dayP&&x.desc.indexOf(dayP.branch)>=0)palaceNotes.push("配偶宫（日支"+dayP.branch+"）逢冲："+x.desc+" 落到感情上，婚姻宫不安定，关系里聚少离多或起伏较大的倾向更明显，宜晚婚、宜给彼此空间，反而能把冲化成距离产生的新鲜感。");});
  love=love.concat(palaceNotes);
  var loveSha=chart.shenSha.filter(function(s){return s.name.indexOf("桃花")>=0||s.name.indexOf("孤辰")>=0||s.name.indexOf("寡宿")>=0||s.name.indexOf("华盖")>=0;});
  if(loveSha.length)love.push("感情相关的神煞再补一笔："+loveSha.map(function(s){return s.name+"在 "+s.at+"——"+s.desc;}).join(" ")+"神煞只作性情与缘分氛围的提示：有桃花不等于必有纷扰，有孤寡也不等于姻缘无望，最终仍以配偶星与配偶宫的实际力量为准。");
  var curDyL=chart.daYun.currentIdx>=0?chart.daYun.steps[chart.daYun.currentIdx]:null;
  var curLnL=null;chart.liuNian.forEach(function(l){if(l.current)curLnL=l;});
  if(curDyL){
    var dySpouse=spouseNames.indexOf(curDyL.stemShiShen)>=0||spouseNames.indexOf(curDyL.branchShiShen)>=0;
    var dyElL=elementOfStem(curDyL.stem);
    var lnTxtL=curLnL?(" 今年 "+curLnL.year+" "+curLnL.gz+" 流年天干是"+curLnL.stemShiShen+(spouseNames.indexOf(curLnL.stemShiShen)>=0?"，正引动配偶星，这一年感情事件的显形度比平常高，遇人、定关系或做重要决定都更容易在这一年发生。":chart.xiYong.xi.indexOf(elementOfStem(curLnL.gz.charAt(0)))>=0?"，流年五行是命局所喜，感情氛围偏顺，适合推进关系。":chart.xiYong.ji.indexOf(elementOfStem(curLnL.gz.charAt(0)))>=0?"，流年五行是命局所忌，这一年感情宜稳不宜急，重要决定多留冷静期。":"，与配偶星喜忌关系平平，感情按原节奏走即可。")):"";
    love.push("落到当前阶段：你正走 "+curDyL.gz+" 大运（约 "+curDyL.startYear+" 年起，天干"+curDyL.stemShiShen+"、地支本气"+curDyL.branchShiShen+"）。"+(dySpouse?"这步运的天干或地支本气正带配偶星（"+curDyL.stemShiShen+"／"+curDyL.branchShiShen+"），是原局感情信号被集中引动的十年：单身者相遇概率明显高于其他运，有伴者则多在这步运里谈婚论嫁或做关系的大决定。":chart.xiYong.xi.indexOf(dyElL)>=0?"这步运不直接带配偶星，但天干五行是命局所喜，心气与状态在线，感情多半跟着整体运势一起顺，属于「人顺了、缘分也容易顺」的十年。":chart.xiYong.ji.indexOf(dyElL)>=0?"这步运不直接带配偶星，天干五行又是命局所忌，这十年重心容易被事业与压力占满，感情不是没机会，而是需要刻意留出时间与心力，不然好缘分也会被忙过去。":"这步运不直接引动配偶星，感情在这十年以平稳经营为主，大起大落的信号不强，适合在关系里做长期的积累。")+lnTxtL);

  health.push("以上是传统五行对应的参详，不是医学判断；身体真有不舒服，及时就医检查，别拿命理代替诊断。");

  var dayunNotes=chart.daYun.steps.map(function(st){

  }else{

    sections.push({title:"流年提示",paragraphs:[curLn.year+" 年是 "+curLn.gz+" 年，流年天干对你是「"+curLn.stemShiShen+"」："+(LIUNIAN_NOTE[curLn.stemShiShen]||"")+" "+rel+"。流年只是当年的天气，成事还要看大运的地基与自己的行动。"]});

<script>

/* ===== 界面 ===== */

}
$("castBtn").addEventListener("click",function(){
  showErr("");

    var parts=$("bd").value.split("-");

  }else{
    var ly=Number($("ly").value);
    if(!ly||ly<1900||ly>2100){showErr("请填农历出生年份（1900–2100）。");return;}
    entered={name:$("nm").value.trim(),gender:state.gender,calendar:"农历",year:ly,month:Number($("lm").value),day:Number($("ld").value),leap:$("lleap").checked,hour:ht.hour,minute:ht.minute};
  }
  doCast(entered);
});
function doCast(entered){
  var solar={y:entered.year,m:entered.month,d:entered.day},convertedSolar="";
  if(entered.calendar==="农历"){
    var s=lunarToSolar(entered.year,entered.month,entered.day,entered.leap);
    if(!s){showErr("农历 "+entered.year+" 年"+(entered.leap?"闰":"")+(LUNAR_MONTH_NAMES[entered.month-1]||"")+(LUNAR_DAY_NAMES[entered.day-1]||"")+" 换算不出公历日期：请检查这一年是否有这个闰月、该月是否有这一天，或改用公历输入。");return;}
    solar=s;convertedSolar="已换算为公历 "+s.y+" 年 "+s.m+" 月 "+s.d+" 日";
  }
  var chart=computeBazi({solar:solar,hour:entered.hour,minute:entered.minute,gender:entered.gender});
  var reading=buildReading(chart,entered.gender);
  renderResult(chart,reading,entered,convertedSolar);
}
function renderResult(chart,reading,entered,convertedSolar){
  var maxCount=1;for(var k in chart.counts)maxCount=Math.max(maxCount,chart.counts[k]);
  var h='<div class="fade">';
  h+='<div class="pdf-bar"><button id="pdfBtn" type="button" class="btn-pdf">生成 PDF 报告</button><span id="pdfMsg" class="small" role="status"></span></div>';
  /* 命盘 */
  h+='<section class="card" aria-label="四柱命盘">';
  h+='<p class="small" style="margin:0">'+esc((entered.name?entered.name+" · ":"")+entered.gender+"命 · "+chart.solarLabel+(chart.lunarLabel?" · "+chart.lunarLabel:""))+'</p>';
  if(convertedSolar)h+='<p class="small" style="margin:2px 0 0">'+esc(convertedSolar)+'</p>';
  h+='<div class="pillars">';
  chart.pillars.forEach(function(p){

function pdfLibReady(){return !!(window.html2canvas&&window.jspdf&&window.jspdf.jsPDF);}
function loadPdfLib(cb){
  if(pdfLibReady()){cb(true);return;}
  var urls=[
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
    "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js",
    "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
  ];
  var i=0;
  (function next(){
    if(pdfLibReady()){cb(true);return;}
    if(i>=urls.length){cb(false);return;}
    var s=document.createElement("script");
    s.src=urls[i++];
    s.onload=next;
    s.onerror=next;
    document.head.appendChild(s);
  })();
}
function generatePdf(){
  if(!lastReport)return;
  var msg=$("pdfMsg"),btn=$("pdfBtn");
  btn.disabled=true;msg.textContent="正在准备…";
  loadPdfLib(function(ok){
    if(!ok||!pdfLibReady()){
      btn.disabled=false;
      msg.textContent="PDF 组件没能加载（需要联网），请检查网络后重新点一次。";
      return;
    }
    var root=$("pdfRoot"),doc=$("pdfDoc");
    $("pdfTopMsg").textContent="正在生成 PDF，请稍候…";
    doc.innerHTML=buildPdfHtml(lastReport.chart,lastReport.reading,lastReport.entered,lastReport.convertedSolar);
    root.className="";root.scrollTop=0;
    msg.textContent="正在生成 PDF…";
    var fname="命格报告-"+(lastReport.entered.name||lastReport.chart.pillarsLabel.replace(/ /g,""))+".pdf";
    var el=doc.firstChild;
    var blocks=[];
    for(var i=0;i<el.children.length;i++)blocks.push(el.children[i]);
    /* 等字体就绪再逐块绘制，避免衬线字体未加载完就出图导致字形走样 */
    var fontsReady=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
    fontsReady.then(function(){
      var JsPDF=window.jspdf.jsPDF;
      var pdf=new JsPDF({unit:"mm",format:"a4",orientation:"portrait"});
      var PAGE_W=210,PAGE_H=297,M_TOP=12,M_BOT=11,M_X=10;
      var CW=PAGE_W-2*M_X,FULL_H=PAGE_H-M_TOP-M_BOT;
      var y=M_TOP;
      function place(cv){
        var pxPerMm=cv.width/CW,h=cv.height/pxPerMm;
        if(h>FULL_H){
          /* 单块比一整页还高（极少出现）：切片续排，不丢内容 */
          var off=0;
          while(off<cv.height){
            var availPx=Math.floor((PAGE_H-M_BOT-y)*pxPerMm);
            if(availPx<=0){pdf.addPage();y=M_TOP;continue;}
            var curPx=Math.min(cv.height-off,availPx);
            var sc=document.createElement("canvas");sc.width=cv.width;sc.height=curPx;
            sc.getContext("2d").drawImage(cv,0,off,cv.width,curPx,0,0,cv.width,curPx);
            pdf.addImage(sc.toDataURL("image/jpeg",0.96),"JPEG",M_X,y,CW,curPx/pxPerMm);
            off+=curPx;y+=curPx/pxPerMm;
            if(off<cv.height){pdf.addPage();y=M_TOP;}
          }
          return;
        }
        if(y+h>PAGE_H-M_BOT){pdf.addPage();y=M_TOP;}
        pdf.addImage(cv.toDataURL("image/jpeg",0.96),"JPEG",M_X,y,CW,h);
        y+=h;
      }
      var chain=Promise.resolve();
      blocks.forEach(function(b){
        chain=chain.then(function(){
          return html2canvas(b,{scale:2,useCORS:true,backgroundColor:"#ffffff",logging:false}).then(place);
        });
      });
      return chain.then(function(){
        var n=pdf.getNumberOfPages();
        if(n>1){
          pdf.setFontSize(9);pdf.setTextColor(150,150,150);
          for(var p=1;p<=n;p++){pdf.setPage(p);pdf.text(p+" / "+n,PAGE_W/2,PAGE_H-4.5,{align:"center"});}
        }
        var blob=pdf.output("blob");
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");
        a.href=url;a.download=fname;
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(url);},4000);
        root.className="hidden";doc.innerHTML="";
        btn.disabled=false;
        msg.textContent="PDF 已生成："+fname+"（请在浏览器下载中查看，也可直接转发这个文件）。";
      });
    }).catch(function(){
      root.className="hidden";doc.innerHTML="";
      btn.disabled=false;
      msg.textContent="这次生成没成功，请再点一次试试。";
    });
  });
}
